<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <linearGradient id="cfqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#111823" />
      <stop offset="100%" stop-color="#070a0f" />
    </linearGradient>
    <linearGradient id="cfqCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2532" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0e141f" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cfqOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6821f" />
      <stop offset="50%" stop-color="#faad3f" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="cfqGlowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6821f" stop-opacity="0" />
      <stop offset="50%" stop-color="#faad3f" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </linearGradient>
    <filter id="shadowCfq" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#cfqBg)" />
  <rect width="1198" height="418" x="1" y="1" rx="15" fill="none" stroke="#1f2937" stroke-width="2" />

  <!-- Grid texture -->
  <g opacity="0.07" stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Accent glow line -->
  <line x1="100" y1="2" x2="1100" y2="2" stroke="url(#cfqGlowLine)" stroke-width="3" />

  <!-- Title & Branding -->
  <g transform="translate(60, 75)">
    <!-- Icon -->
    <rect width="44" height="44" rx="10" fill="#451a03" stroke="#f6821f" stroke-width="2" />
    <path d="M12 24C12 18 16 14 22 14C26 14 29 16 30 19C32 19 34 21 34 24C34 27 32 29 29 29H14C12.5 29 12 27.5 12 24Z" fill="none" stroke="#faad3f" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Text -->
    <text x="56" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#cfqOrange)" letter-spacing="-0.5">cfq-tunnel</text>
    <text x="245" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1.5">v1.0.0</text>
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">Keep Cloudflare quick tunnels alive &amp; publish changing addresses in real time.</text>
  </g>

  <!-- Feature Badges -->
  <g transform="translate(60, 175)">
    <!-- Badge 1: No CF Account Needed -->
    <rect width="195" height="32" rx="16" fill="#451a03" fill-opacity="0.6" stroke="#f6821f" stroke-width="1.5" />
    <text x="97" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="middle">☁️ Zero CF Account Needed</text>

    <!-- Badge 2: Vercel Edge Config -->
    <g transform="translate(207, 0)">
      <rect width="185" height="32" rx="16" fill="#0f172a" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="92" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7dd3fc" text-anchor="middle">▲ Vercel Edge Config Sync</text>
    </g>

    <!-- Badge 3: Health Watchdog -->
    <g transform="translate(404, 0)">
      <rect width="165" height="32" rx="16" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
      <text x="82" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">🛡️ Health Watchdog</text>
    </g>

    <!-- Badge 4: Fast Restart -->
    <g transform="translate(581, 0)">
      <rect width="170" height="32" rx="16" fill="#1e1b4b" fill-opacity="0.6" stroke="#818cf8" stroke-width="1.5" />
      <text x="85" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" text-anchor="middle">⚡ Auto-Reconnect Loop</text>
    </g>
  </g>

  <!-- Interactive Terminal / Flow Diagram Card -->
  <g transform="translate(60, 230)" filter="url(#shadowCfq)">
    <rect width="1080" height="150" rx="12" fill="url(#cfqCard)" stroke="#334155" stroke-width="1.5" />
    
    <!-- Window controls -->
    <circle cx="24" cy="20" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="20" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="20" r="5.5" fill="#10b981" />
    <text x="95" y="24" font-family="'Fira Code', monospace" font-size="12" fill="#64748b">cfq-tunnel --publish-vercel-edge-config — live pipeline</text>

    <!-- Flow Node 1: Local Origin -->
    <g transform="translate(30, 48)">
      <rect width="260" height="80" rx="8" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#38bdf8">Local Backend</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">http://localhost:8000</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#10b981">● Serving requests (0.4s)</text>
    </g>

    <!-- Arrow 1 -->
    <g transform="translate(305, 78)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#f6821f" stroke-width="2" />
      <polygon points="60,6 70,10 60,14" fill="#f6821f" />
      <text x="35" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#faad3f" text-anchor="middle">QUICK TUNNEL</text>
    </g>

    <!-- Flow Node 2: cfq Watchdog -->
    <g transform="translate(390, 48)">
      <rect width="320" height="80" rx="8" fill="#0b0f19" stroke="#f6821f" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#faad3f">cfq-tunnel Watchdog</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#cbd5e1">*.trycloudflare.com (dynamic)</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#34d399">Health check &amp; auto-publish</text>
    </g>

    <!-- Arrow 2 -->
    <g transform="translate(725, 78)">
      <line x1="0" y1="10" x2="60" y2="10" stroke="#38bdf8" stroke-width="2" />
      <polygon points="60,6 70,10 60,14" fill="#38bdf8" />
      <text x="35" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#7dd3fc" text-anchor="middle">EDGE SYNC</text>
    </g>

    <!-- Flow Node 3: Target Consumer -->
    <g transform="translate(800, 48)">
      <rect width="250" height="80" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="1.5" />
      <text x="16" y="28" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#10b981">Vercel Frontend</text>
      <text x="16" y="48" font-family="'Fira Code', monospace" font-size="11" fill="#94a3b8">Edge Middleware /api/*</text>
      <text x="16" y="66" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">Zero client reconfiguration</text>
    </g>
  </g>
</svg>
